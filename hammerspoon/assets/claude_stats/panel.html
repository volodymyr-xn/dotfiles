<!doctype html>
<!--
  The dropdown behind the claude_stats menubar item (modules/claude_stats.lua),
  styled after ClaudeBar's SwiftUI popup (github.com/LHner1/claude-bar,
  PopupView.swift and Components.swift): header with a traffic light, limit
  rings, sessions, footer. ClaudeBar shows one profile; this merges three
  into the same sections.

  Lua drives the page through window.claudeStats:
    configure(profiles)  [{ name, title }], in display order
    update(event)        a `sessions` line from c-claude-stats-macos
    setVisible(bool)     relative times only tick while the panel is open
  and the page answers on webkit.messageHandlers.claudeStats with
  { action: "resize", height }, { action: "focus", pid, cwd } and
  { action: "reveal", cwd }.

  Text sizes follow ClaudeBar's (8–13pt) rather than the 14px floor, by
  choice: the point is to look like it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --primary: rgba(0, 0, 0, 0.85);
    --secondary: rgba(0, 0, 0, 0.5);
    --tertiary: rgba(0, 0, 0, 0.28);
    --divider: rgba(0, 0, 0, 0.08);
    --hover: rgba(0, 0, 0, 0.08);
    --lamp-off: rgba(0, 0, 0, 0.2);
    --lamp-rim: rgba(0, 0, 0, 0.45);
    --surface: rgb(242, 242, 244);
    --border: rgba(0, 0, 0, 0.14);
    --red: #ff3b30;
    --orange: #ff9500;
    --yellow: #ffcc00;
    --limit-yellow: #a37b00;
    --green: #34c759;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: rgba(255, 255, 255, 0.86);
      --secondary: rgba(255, 255, 255, 0.55);
      --tertiary: rgba(255, 255, 255, 0.28);
      --divider: rgba(255, 255, 255, 0.08);
      --hover: rgba(255, 255, 255, 0.08);
      --lamp-off: rgba(255, 255, 255, 0.2);
      --lamp-rim: rgba(255, 255, 255, 0.45);
      --surface: rgb(36, 38, 38);
      --border: rgba(255, 255, 255, 0.14);
      --red: #ff453a;
      --orange: #ff9f0a;
      --yellow: #ffd60a;
      --limit-yellow: #ffd60a;
      --green: #30d158;
    }
  }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
  }

  /* Room around the panel for its shadow; the window itself is clear. */
  body {
    padding: 2px 10px 18px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    color: var(--primary);
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  /* Header and footer stay put; the sections between them scroll once the
     window is capped at the screen's height (Lua sizes the window, the page
     fills it). The body padding is the 20px subtracted below. */
  .panel {
    box-sizing: border-box;
    width: 300px;
    max-height: calc(100vh - 20px);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }

  .panel-header,
  .footer {
    flex: 0 0 auto;
  }

  .panel-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* A thin thumb on a clear track, so a system set to always show scroll
     bars does not put a full-width gutter inside a 300pt panel. */
  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb {
    background: var(--tertiary);
    border-radius: 3px;
  }

  .numeric { font-variant-numeric: tabular-nums; }
  .secondary { color: var(--secondary); }

  .divider {
    height: 1px;
    background: var(--divider);
  }

  .divider.spaced { margin-top: 10px; }

  .section-header {
    height: 22px;
    padding-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--secondary);
  }

  /* Traffic light: three lamps in a rounded rim, lit per state. */
  .light {
    display: inline-flex;
    flex-direction: column;
    gap: var(--lamp-gap);
    padding: 2px;
    border: 1px solid var(--lamp-rim);
    border-radius: calc(var(--lamp) * 0.7 + 2px);
    flex: none;
  }

  .light i {
    display: block;
    width: var(--lamp);
    height: var(--lamp);
    border-radius: 50%;
    background: var(--lamp-off);
  }

  .light i.on-red { background: linear-gradient(var(--red), color-mix(in srgb, var(--red) 80%, black)); box-shadow: 0 0 1.5px color-mix(in srgb, var(--red) 80%, transparent); }
  .light i.on-yellow { background: linear-gradient(var(--yellow), color-mix(in srgb, var(--yellow) 80%, black)); box-shadow: 0 0 1.5px color-mix(in srgb, var(--yellow) 80%, transparent); }
  .light i.on-green { background: linear-gradient(var(--green), color-mix(in srgb, var(--green) 80%, black)); box-shadow: 0 0 1.5px color-mix(in srgb, var(--green) 80%, transparent); }

  .light.large { --lamp: 7px; --lamp-gap: 2px; }
  .light.small { --lamp: 4.5px; --lamp-gap: 1.5px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
  }

  .header .title {
    font-size: 13px;
    font-weight: 600;
  }

  .header .summary {
    margin-top: 1px;
    font-size: 11px;
    color: var(--secondary);
  }

  /* Limits: one row per profile, a column per window. */
  .limits-grid {
    display: grid;
    grid-template-columns: 76px 1fr 1fr;
    align-items: center;
    row-gap: 8px;
    padding: 10px 12px 2px 16px;
  }

  .limits-grid .window-caption {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
  }

  /* A hairline across the whole row between two profiles. */
  .limits-grid .limits-divider {
    grid-column: 1 / -1;
    height: 1px;
    background: var(--divider);
  }

  .limits-grid .profile-name {
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gauge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    min-width: 0;
  }

  .gauge .pct {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .gauge .reset {
    width: 100%;
    font-size: 10px;
    color: var(--secondary);
    font-variant-numeric: tabular-nums;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-note {
    padding: 8px 16px 0;
    font-size: 10px;
    color: var(--secondary);
    text-align: center;
  }

  /* Sessions */
  .sessions { padding: 0 8px 10px; }

  .group-label {
    display: flex;
    justify-content: space-between;
    padding: 6px 6px 2px;
    font-size: 10px;
    font-weight: 500;
    color: var(--secondary);
  }

  .session {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    margin-bottom: 2px;
    border-radius: 6px;
    transition: background-color 0.16s ease-out;
  }

  .session:hover { background: var(--hover); }

  .session .text {
    flex: 1;
    min-width: 0;
  }

  .session .name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session .details {
    margin-top: 1px;
    font-size: 10px;
    color: var(--secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session .status {
    flex: none;
    margin-left: 6px;
    text-align: right;
  }

  .session .state {
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }

  .session .since {
    margin-top: 1px;
    font-size: 10px;
    color: var(--secondary);
    font-variant-numeric: tabular-nums;
  }

  .state.waiting { color: var(--red); }
  .state.busy { color: var(--orange); }
  .state.idle { color: var(--green); }
  .state.unknown { color: var(--secondary); }

  .more {
    padding: 2px 0 4px;
    font-size: 10px;
    color: var(--secondary);
    text-align: center;
  }

  .no-sessions {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--secondary);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--divider);
    font-size: 10px;
    color: var(--tertiary);
  }

  .footer span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="panel-header">
    <div class="header">
      <span class="light large" id="header-light"><i></i><i></i><i></i></span>
      <div>
        <div class="title">Claude Code</div>
        <div class="summary" id="summary">Starting…</div>
      </div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="panel-body" id="panel-body">
    <div id="limits"></div>
    <div class="divider spaced"></div>

    <div class="section-header">Sessions</div>
    <div class="sessions" id="sessions"></div>
  </div>

  <div class="footer">
    <span id="footer-limits"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MAX_SESSIONS_PER_PROFILE = 5;
  var TICK_MILLISECONDS = 30000;
  var STATE_LABELS = { waiting: "needs you", busy: "working", idle: "ready" };
  var LAMP_BY_STATE = { waiting: "red", busy: "yellow", idle: "green" };

  var profiles = [];
  var sessionsEvent = null;
  // { profileName: { fiveHour: "yellow", ... } } from the statusline's own
  // colouring (Lua computes it); a window missing here falls back to the
  // page's thresholds.
  var limitColors = {};
  var LIMIT_COLOR_VARS = { red: "var(--red)", yellow: "var(--limit-yellow)", green: "var(--green)" };
  var tickTimer = null;
  var lastHeight = 0;

  function post(message) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.claudeStats) {
      window.webkit.messageHandlers.claudeStats.postMessage(message);
    }
  }

  function escapeHtml(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nowSeconds() {
    return Date.now() / 1000;
  }

  // ---- Formatting, after ClaudeBar's Fmt --------------------------------

  function formatDuration(seconds) {
    var total = Math.max(0, Math.floor(seconds));
    var days = Math.floor(total / 86400);
    var hours = Math.floor((total % 86400) / 3600);
    var minutes = Math.floor((total % 3600) / 60);

    if (days > 0) return days + "d " + hours + "h";
    if (hours > 0) return hours + "h " + minutes + "m";
    if (minutes > 0) return minutes + "m";
    return "<1m";
  }

  function formatAge(epochSeconds) {
    var age = nowSeconds() - epochSeconds;

    return age < 60 ? "now" : formatDuration(age);
  }

  function percentColor(pct) {
    if (pct >= 85) return "var(--red)";
    if (pct >= 60) return "var(--orange)";
    return "var(--green)";
  }

  // ---- Shared pieces ----------------------------------------------------

  function lightHtml(sizeClass, lit) {
    var lamps = ["red", "yellow", "green"].map(function (color) {
      return '<i class="' + (lit[color] ? "on-" + color : "") + '"></i>';
    });

    return '<span class="light ' + sizeClass + '">' + lamps.join("") + "</span>";
  }

  function allSessions() {
    if (!sessionsEvent) return [];

    return sessionsEvent.profiles.reduce(function (list, report) {
      return list.concat(report.sessions);
    }, []);
  }

  function reportFor(name) {
    if (!sessionsEvent) return null;

    return sessionsEvent.profiles.find(function (report) { return report.name === name; }) || null;
  }

  // After a reset the window is empty until a session reports fresh data.
  function effectivePct(limitWindow) {
    if (!limitWindow) return null;

    return limitWindow.resetsAt > nowSeconds() ? limitWindow.pct : 0;
  }

  // ---- Header -----------------------------------------------------------

  function renderHeader() {
    var sessions = allSessions();
    var counts = { waiting: 0, busy: 0, idle: 0 };

    sessions.forEach(function (session) {
      if (counts[session.state] != null) counts[session.state] += 1;
    });

    var parts = [];

    if (counts.waiting > 0) parts.push(counts.waiting + (counts.waiting === 1 ? " needs you" : " need you"));
    if (counts.idle > 0) parts.push(counts.idle + " ready");
    if (counts.busy > 0) parts.push(counts.busy + " working");

    document.getElementById("summary").textContent = !sessionsEvent
      ? "Starting…"
      : (parts.length ? parts.join(" · ") : "No active session");

    document.getElementById("header-light").outerHTML = lightHtml("large", {
      red: counts.waiting > 0,
      yellow: counts.busy > 0,
      green: counts.idle > 0,
    }).replace('class="light large"', 'class="light large" id="header-light"');
  }

  // ---- Limits -----------------------------------------------------------

  // The share used, in its threshold colour, over the time left.
  function gaugeHtml(limitWindow, colorName) {
    var pct = effectivePct(limitWindow);
    var color = LIMIT_COLOR_VARS[colorName] || (pct == null ? null : percentColor(pct));
    var pctStyle = color ? ' style="color: ' + color + '"' : "";

    // Time left in the window rather than the clock time it ends at; the
    // panel re-renders every 30s while open, so the countdown keeps up.
    var reset = !limitWindow ? "no data" : (limitWindow.resetsAt > nowSeconds()
      ? "resets in " + formatDuration(limitWindow.resetsAt - nowSeconds())
      : "reset");

    return '<div class="gauge">' +
      '<span class="pct"' + pctStyle + ">" + (pct == null ? "–" : Math.round(pct) + "%") + "</span>" +
      '<span class="reset">' + escapeHtml(reset) + "</span>" +
      "</div>";
  }

  // A row per profile, sorted by name — claude, claude-dev, claude-dt — and
  // a column per limit window.
  function renderLimits() {
    var container = document.getElementById("limits");
    var windows = [
      { caption: "5 hours", key: "fiveHour" },
      { caption: "Week", key: "sevenDay" },
    ];
    var anyData = profiles.some(function (profile) {
      var report = reportFor(profile.name);
      return report && report.limits;
    });
    var cells = ["<div></div>"].concat(windows.map(function (limitWindow) {
      return '<div class="window-caption">' + limitWindow.caption + "</div>";
    }));

    profiles.slice().sort(function (left, right) {
      return left.name < right.name ? -1 : 1;
    }).forEach(function (profile, index) {
      var report = reportFor(profile.name);
      var limits = report && report.limits;

      if (index > 0) {
        cells.push('<div class="limits-divider"></div>');
      }

      cells.push('<div class="profile-name">' + escapeHtml(profile.title) + "</div>");
      windows.forEach(function (limitWindow) {
        cells.push(gaugeHtml(limits ? limits[limitWindow.key] : null,
          (limitColors[profile.name] || {})[limitWindow.key]));
      });
    });

    container.innerHTML = '<div class="limits-grid">' + cells.join("") + "</div>" + (anyData || !sessionsEvent ? "" :
      '<div class="empty-note">No limit data yet. It arrives through the status line as soon as a Claude Code session gets a response.</div>');
  }

  // ---- Sessions ---------------------------------------------------------

  function sessionHtml(session) {
    var folder = session.cwd ? session.cwd.split("/").pop() : "";
    var details = [];

    if (folder && folder !== session.name) details.push(folder);
    if (session.kind === "background") details.push("background");

    var stateClass = STATE_LABELS[session.state] ? session.state : "unknown";
    var stateText = session.state === "waiting" && session.waitingFor
      ? session.waitingFor
      : (STATE_LABELS[session.state] || session.state);
    var lit = {};

    lit[LAMP_BY_STATE[session.state]] = true;

    return '<div class="session" title="' + escapeHtml("Show window · " + session.cwd) + '"' +
      ' data-pid="' + (session.pid == null ? "" : session.pid) + '"' +
      ' data-cwd="' + escapeHtml(session.cwd) + '">' +
      lightHtml("small", lit) +
      '<div class="text"><div class="name">' + escapeHtml(session.name || folder || "Session") + "</div>" +
      '<div class="details">' + escapeHtml(details.length ? details.join(" · ") : "PID " + session.pid) + "</div></div>" +
      '<div class="status"><div class="state ' + stateClass + '">' + escapeHtml(stateText) + "</div>" +
      (session.since ? '<div class="since">for ' + formatDuration(nowSeconds() - session.since) + "</div>" : "") +
      "</div></div>";
  }

  function renderSessions() {
    var container = document.getElementById("sessions");
    var groups = [];

    profiles.forEach(function (profile) {
      var report = reportFor(profile.name);

      if (!report || report.sessions.length === 0) return;

      var shown = report.sessions.slice(0, MAX_SESSIONS_PER_PROFILE).map(sessionHtml).join("");
      var hidden = report.sessions.length - MAX_SESSIONS_PER_PROFILE;

      groups.push('<div class="group-label"><span>' + escapeHtml(profile.title) + '</span><span class="numeric">' +
        report.sessions.length + "</span></div>" + shown +
        (hidden > 0 ? '<div class="more">+ ' + hidden + " more</div>" : ""));
    });

    container.innerHTML = groups.length ? groups.join("") :
      '<div class="no-sessions">' + (sessionsEvent ? "No Claude Code session running" : "Looking for sessions…") + "</div>";
  }

  // ---- Footer -----------------------------------------------------------

  function renderFooter() {
    var ages = profiles.map(function (profile) {
      var report = reportFor(profile.name);

      if (!report || !report.limits || !report.limits.updatedAt) return null;

      return profile.label + " " + formatAge(report.limits.updatedAt);
    }).filter(Boolean);

    document.getElementById("footer-limits").textContent = ages.length
      ? "Limits: " + ages.join(" · ")
      : "Status line not active yet";
  }

  // ---- Wiring -----------------------------------------------------------

  // The height the whole panel would take uncapped: the body's full scroll
  // height rather than its box, which is already clamped to the window.
  function reportHeight() {
    var panel = document.getElementById("panel");
    var body = document.getElementById("panel-body");
    var bodyPadding = 20;
    var height = Math.ceil(panel.offsetHeight - body.clientHeight + body.scrollHeight + bodyPadding);

    if (height !== lastHeight) {
      lastHeight = height;
      post({ action: "resize", height: height });
    }
  }

  function renderLive() {
    renderHeader();
    renderLimits();
    renderSessions();
    renderFooter();
    reportHeight();
  }

  function handleClick(event) {
    var row = event.target.closest(".session");

    if (!row) return;

    if (row.dataset.pid) {
      post({ action: "focus", pid: Number(row.dataset.pid), cwd: row.dataset.cwd });
    } else {
      post({ action: "reveal", cwd: row.dataset.cwd });
    }
  }

  document.addEventListener("click", handleClick);

  window.claudeStats = {
    configure: function (profileList) {
      profiles = profileList;
      renderLive();
    },

    update: function (event) {
      if (event.event === "sessions") {
        sessionsEvent = event;
        renderLive();
      }
    },

    setLimitColors: function (colors) {
      limitColors = colors || {};
      renderLimits();
      reportHeight();
    },

    setVisible: function (visible) {
      clearInterval(tickTimer);
      tickTimer = null;

      if (visible) {
        renderLive();
        tickTimer = setInterval(renderLive, TICK_MILLISECONDS);
      }
    },
  };

  renderLive();
})();
</script>
</body>
</html>
