<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 0 26 48" width="26" height="48">
  <!-- Six-tooth gear for the process-stats menubar item.
       One path with the bore as a second subpath, so evenodd punches the hole
       through rather than painting it: the image is handed to hs.menubar as a
       template, where only the alpha channel counts and a filled bore would
       come out solid. Black for the same reason — AppKit repaints a template
       image in whichever colour the menubar wants, light or dark.
       Stroked in its own fill colour with a round join, which is what softens
       the tooth corners — the teeth are drawn as square-cornered arcs and the
       join does the rounding, rather than every corner carrying its own arc.
       Two things are set by this box rather than from Lua, because hs.image
       ignores setSize on an SVG (it stays as authored) and hs.menubar scales
       whatever it is given to the height of the bar: the vertical padding
       decides how large the gear reads beside the system icons, and the
       cropped width decides how wide a slot the item claims. -->
  <path fill="#000000" fill-rule="evenodd" stroke="#000000" stroke-width="2.0"
        stroke-linejoin="round" d="M22.46 16.41A7.74 7.74 0 0 1 25.54 16.41L25.41 18.91A5.28 5.28 0 0 1 27.70 20.23L29.80 18.87A7.74 7.74 0 0 1 31.34 21.54L29.11 22.68A5.28 5.28 0 0 1 29.11 25.32L31.34 26.46A7.74 7.74 0 0 1 29.80 29.13L27.70 27.77A5.28 5.28 0 0 1 25.41 29.09L25.54 31.59A7.74 7.74 0 0 1 22.46 31.59L22.59 29.09A5.28 5.28 0 0 1 20.30 27.77L18.20 29.13A7.74 7.74 0 0 1 16.66 26.46L18.89 25.32A5.28 5.28 0 0 1 18.89 22.68L16.66 21.54A7.74 7.74 0 0 1 18.20 18.87L20.30 20.23A5.28 5.28 0 0 1 22.59 18.91L22.46 16.41ZM21.18 24.00A2.82 2.82 0 1 0 26.82 24.00A2.82 2.82 0 1 0 21.18 24.00Z"/>
</svg>
