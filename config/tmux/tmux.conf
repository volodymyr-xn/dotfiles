## Select mode colors
# Select mode color(use default for now)
set -g mode-style fg=#2f3042,bg=green

# Window status format
setw -g window-status-format " #I:#W  "
setw -g window-status-current-format " #I:#W  "

# Default window title colors
set-window-option -g window-status-style fg=#f0f0f7,bg=default
# Active window title colors
set-window-option -g window-status-current-style fg=#2f3042,bg=#82d595
# set-window-option -g window-status-current-style fg=#2f3042,bg=#28f780

# Pane border
set -g pane-border-style fg=yellow,bg=default
set -g pane-active-border-style fg=yellow,bg=default

# Message text
set-option -g message-style fg=yellow,bg=#303245

# Pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour red #orange


# Add zoom indicator to right status panel
set -g status-right '#{?window_zoomed_flag,#[bg=yellow]#[fg=black]  ///     TMUX WINDOW MAXIMIZED       ///  #[fg=default]#[bg=default],}'

# Clock
