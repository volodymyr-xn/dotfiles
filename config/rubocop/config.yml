AllCops:
  Exclude:
    - 'bin/*'
    - 'node_modules/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'util/**/*'
    - 'spec/**/*'
    - 'vendor/**/*'
    - '.pryrc'
    - 'Guardfile'


Style/EmptyLambdaParameter:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true

Style/BlockDelimiters:
  Enabled: true
  EnforcedStyle: 'braces_for_chaining'

# Add a comment describing each gem in Gemfile
Bundler/GemComment:
  Enabled: true

Layout/SpaceInLambdaLiteral:
  Enabled: true
  EnforcedStyle: 'require_space'

Metrics/ClassLength:
  Max: 350
  Exclude:
    - 'app/models/**/*'

Metrics/MethodLength:
  Max: 40
  Exclude:
    - 'app/searches/**/*'

Layout/LineLength:
  Max: 100
  AllowedPatterns: ['(\A|\s)#']

Metrics/AbcSize:
  Max: 30

Metrics/PerceivedComplexity:
  Max: 8

Metrics/CyclomaticComplexity:
  Max: 8

# Disable some rules

Style/StringLiterals:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/CommentAnnotation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Style/Lambda:
  Enabled: false

Style/LambdaCall:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Style/WordArray:
  Enabled: false

Style/RedundantSelf:
  Enabled: false


# Multi-line assignment: the value (incl. a method-chain receiver) goes on its
# own line below `=`, never on the same line as `=`. send/csend extend the
# stock SupportedTypes to cover method chains; MultilineMethodCallIndentation
# then indents the chain under the receiver.
Layout/MultilineAssignmentLayout:
  Enabled: true
  EnforcedStyle: new_line
  SupportedTypes: [send, csend, block, case, class, if, kwbegin, module]

Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: 'indented_relative_to_receiver'

Style/SafeNavigation:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Style/AndOr:
  Enabled: false

Lint/AmbiguousOperator:
  Enabled: false

Style/NegatedIf:
 Enabled: false

Lint/UnusedBlockArgument:
 Enabled: false

Lint/SuppressedException:
  Enabled: false

Style/RedundantBegin:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/Alias:
  Enabled: false

Layout/SpaceAroundOperators:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Enabled: false

Style/FormatString:
  Enabled: false

Style/IfInsideElse:
  Enabled: false

Style/MultilineMemoization:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false
