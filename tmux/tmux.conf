# ============================================================================
# TERMINAL & CAPABILITIES
# ============================================================================

set -g default-terminal "tmux-256color"

# Reset the option before the appends below. `set -a` appends to an array
# option, so every `prefix + r` re-adds the same entries to a server-wide
# option that outlives the reload — it had grown to 770 entries (59 of them
# xterm-ghostty), and tmux scans that array linearly on every capability
# lookup. Unsetting first makes a reload idempotent.
set -su terminal-features

# Declare ghostty's capabilities so tmux stops falling back to slower
# escape-heavy encodings.
#   sync         - DECSET 2026 synchronized output; tmux batches a frame and
#                  flips atomically, eliminating tearing on scrollback dumps,
#                  full redraws, and status-bar refreshes
#   RGB          - 24-bit truecolor without xterm-256 quantisation
#   clipboard    - OSC52 clipboard set/get, no shell round-trip
#   focus        - CSI ?1004h focus in/out events (used by nvim, etc.)
#   osc7         - shell-reported cwd
#   title        - window/pane title setting
#   hyperlinks   - OSC 8 clickable links
#   usstyle      - extended underline styles (undercurl, colored, dotted)
#   strikethrough
#   ccolour      - cursor color set via OSC
#   cstyle       - cursor shape set via DECSCUSR
#   extkeys      - distinguish Ctrl-[ from Esc, Ctrl-Enter, etc.
#   progressbar  - OSC 9;4 progress reporting; tmux stores it per pane as
#                  #{pane_pb_state}/#{pane_pb_progress} and forwards it to
#                  ghostty, which renders it on the tab and dock icon
#
# Features are separated by COLONS, not commas. terminal-features is an array
# option that tmux splits on commas, so the comma form declared one real entry
# (xterm-ghostty:sync) plus a list of bare feature names with no terminal
# pattern, which tmux ignores — osc7, hyperlinks, usstyle and strikethrough
# were silently never applied.
set -ag terminal-features 'xterm-ghostty:sync:RGB:clipboard:focus:osc7:title:hyperlinks:usstyle:strikethrough:ccolour:cstyle:extkeys:progressbar'

# Use non login shell for tmux windows and panels
set -g default-command "${SHELL}"

# Enable extended keys for Control-number bindings (extkeys already declared
# above for xterm-ghostty; xterm* covers other xterm-family $TERM values).
# `always` (vs `on`) makes tmux unconditionally encode modifier-key combos
# (Ctrl-Shift-letter, Ctrl-[, Ctrl-Enter, etc.) in CSI-u form, so apps that
# don't request DECSET 2027 still receive disambiguated keys — helps nvim
# distinguish <C-i>/<Tab> and <C-m>/<CR>, and hardens the ghostty
# ctrl+number bindings.

# `always` is required, not just `on`: with `on` tmux negotiates CSI-u
# reporting with the outer terminal only while an application in the pane
# asks for it. tmux's own UI modes (choose-tree, copy-mode) ask for nothing,
# so Ctrl-<n> degrades to a bare digit there and mode-tree eats it as its
# own 0-based shortcut. `always` keeps the keys disambiguated in modes too.
# in case of broken mappings try reverting to this:
# set -s extended-keys on
set -s extended-keys always

set -as terminal-features 'xterm*:extkeys'

# ============================================================================
# GENERAL OPTIONS
# ============================================================================

# Send SIGHUP to each process on exit
# this presents posgres running after stoping tmux session with it
set-option -g remain-on-exit off

# Sync tmux's copy buffer to the system clipboard via OSC 52
set -s set-clipboard on

# Enable vi mode
set-option -g status-keys "vi"
set-window-option -g mode-keys "vi"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# Disallow to rename windows
set-window-option -g allow-rename off

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# When the last window of a session closes, attach to another session instead
# of detaching the client back to a bare terminal.
set -g detach-on-destroy off

# Remove delay when pressing esc in Vimtmux
set -sg escape-time 0

# Extend display time of status messages to 2 seconds
set-option -g display-time 2000

# Pin status-bar refresh to the tmux default (15s). Several plugins quietly
# override this to 1s or 5s, which causes a full status redraw every second
# and makes the bar feel twitchy. Setting it explicitly keeps it stable.
set-option -g status-interval 15

# Display tmux session name in terminal title (instead of just "tmux")
set-option -g set-titles on
set-option -g set-titles-string '#S:#I #W'

# Increase scrollback lines (default is 2000)
# set-option -g history-limit 5000
set-option -g history-limit 30000

# Forward terminal focus in/out events to programs (nvim autoread, etc.)
set -g focus-events on

# When two clients view the same session at different sizes, size each window
# to its viewer instead of clamping the whole session to the smallest client.
setw -g aggressive-resize on

# Let programs pass escape sequences straight through tmux (Kitty graphics)
set -g allow-passthrough all

# ============================================================================
# PREFIX
# ============================================================================

# Mappings explanation
# Prefix "C-" - means Ctrl button
# Prefix "M-" - means Alt/Meta button

# Remap prefix from 'C-b' to 'C-a', with C-q as a secondary prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================================================
# KEYBINDINGS — SESSIONS
# ============================================================================

# Remap session chooser with disabled preview
bind-key s choose-tree -ZsN -O name
bind-key -T root C-s if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys Down' 'choose-tree -ZsN -O name'
# Unreachable under ghostty, which now rewrites ctrl+enter to a bare carriage
# return (see config/ghostty/config) so the fzf pickers can accept on it. Kept
# for kitty and any terminal that still delivers C-Enter as its own key.
bind-key -T root C-Enter if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys Enter' ''
# bind-key s choose-tree -ZsN -f '#{?@hidden,0,1}'
# bind-key w choose-tree -ZwN -f '#{?@hidden,0,1}'

# Fzf switch tmux session — disabled (prefix+i now splits horizontally)
# bind i split "fzf-switch-tmux-session"
# bind 9 run "tmux split -p 45 bash -ci 'fzf-switch-tmux-session'"

# Switch sessions: Ctrl-Down / Ctrl-- → previous, Ctrl-Up → next
bind -n C-Down switch-client -p
bind -n C-Up switch-client -n
bind -n C-- switch-client -p
# bind -n C-s switch-client -n
# bind -n C-q switch-client -n

# Swtich beetwen Tmux sessions with Ctrl-ArrowUp and Ctrl-ArrowDown
# bind -n C-Up run-shell 'START="#{session_name}"; tmux switch-client -p && while [ "$(tmux display-message -p "##{@hidden}")" = "1" ]; do [ "$(tmux display-message -p "##{session_name}")" = "$START" ] && break; tmux switch-client -p; done'
# bind -n C-Down run-shell 'START="#{session_name}"; tmux switch-client -n && while [ "$(tmux display-message -p "##{@hidden}")" = "1" ]; do [ "$(tmux display-message -p "##{session_name}")" = "$START" ] && break; tmux switch-client -n; done'
# bind -n C-s run-shell 'START="#{session_name}"; tmux switch-client -n && while [ "$(tmux display-message -p "##{@hidden}")" = "1" ]; do [ "$(tmux display-message -p "##{session_name}")" = "$START" ] && break; tmux switch-client -n; done'
# bind -n C-- run-shell 'START="#{session_name}"; tmux switch-client -p && while [ "$(tmux display-message -p "##{@hidden}")" = "1" ]; do [ "$(tmux display-message -p "##{session_name}")" = "$START" ] && break; tmux switch-client -p; done'

# bind -n M-j switch-client -n
# bind -n M-k switch-client -p
# bind -n M-- switch-client -n
# bind -n M-= switch-client -p

# Popup key table - disables session switching inside claude popup.
# Only root-table keys are rerouted through `popup` when key-table is switched;
# prefix-table keys (`s`, `w`) are unaffected by this table, so they aren't
# listed here.
bind -T popup C-Up    ''
bind -T popup C-Down  ''
bind -T popup C-s     ''

# Switch to popup key table when entering claude session, back to root on leave
set-hook -g client-session-changed \
  'if-shell -F "#{m:claude-*,#{session_name}}" \
    "set-option -p key-table popup" \
    "set-option -p key-table root"'

# Toggle claude code tmux popup
bind -r g run-shell 'c-claude-toggle-popup "#{session_name}" "#{pane_current_path}"'

# prefix + G: same idea as prefix+g, but as a floating pane (tmux 3.7) rather
# than a popup. A popup is modal — it freezes the pane underneath until it
# closes — whereas a floating pane sits above the layout and is a real pane, so
# the pane behind it keeps taking input and C-h/j/k/l still move focus out.
#
# Deliberately a separate key, not a replacement for prefix+g: floating panes
# are an early feature in 3.7 — they can only be moved and resized with the
# mouse (resize-pane does not apply), and a saved layout does not restore them.
#
# No geometry flags: on 3.7b `-x`/`-y` are accepted alone but rejected together
# ("size or position invalid"), and `-X`/`-Y` are rejected outright, so the
# default size is the only one that works. Revisit once floating panes settle.
bind-key G new-pane -c "#{pane_current_path}"

# prefix + l: fzf popup listing only the panes running an AI agent (claude,
# codex, gemini, …), across every session, with a live preview on the right.
# Entries are "<status> session (window) │ agent session name"; the agent
# session name comes from the pane title the agent publishes, and the status
# icon is green when it is working, grey when it is waiting on you.
bind l display-popup -E -B -w 100% -h 100% "c-tmux-switch-ai-pane"

# Ctrl+0 also reaches this binding: macOS eats Ctrl+<number> before Ghostty
# sees it, so config/ghostty/config rewrites Ctrl+0 to the prefix + `l` bytes
# rather than tmux binding C-0 in the root table (where it could never fire).

# ============================================================================
# KEYBINDINGS — WINDOWS
# ============================================================================

# Store current path on new window
bind c new-window -c "#{pane_current_path}"

# Switch to specific window with Alt-number
bind -n M-1 selectw -t 1
bind -n M-2 selectw -t 2
bind -n M-3 selectw -t 3
bind -n M-4 selectw -t 4
bind -n M-5 selectw -t 5
bind -n M-6 selectw -t 6
bind -n M-7 selectw -t 7
bind -n M-8 selectw -t 8
bind -n M-9 selectw -t 9

bind -n M-0 next-window

# Switch to specific window with Control-number. Inside choose-tree
# (prefix+s / C-s) the same keys pick the Nth session instead.
#
# The root table is correct here: window_tree_mode declares no .key_table,
# so tmux leaves the default table active in tree-mode (a mode that does
# declare one — copy-mode — would shadow root instead).
#
# mode-tree hardcodes its shortcuts 0-based ('0' + line, see mode-tree.c),
# so forward the digit one lower to get 1-based numbering. Choosing an item
# also exits the mode, so the next C-<n> falls through to selectw.
bind -n C-1 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 0' 'selectw -t 1'
bind -n C-2 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 1' 'selectw -t 2'
bind -n C-3 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 2' 'selectw -t 3'
bind -n C-4 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 3' 'selectw -t 4'
bind -n C-5 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 4' 'selectw -t 5'
bind -n C-6 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 5' 'selectw -t 6'
bind -n C-7 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 6' 'selectw -t 7'
bind -n C-8 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 7' 'selectw -t 8'
bind -n C-9 if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys 8' 'selectw -t 9'

# # Swtich beetwen Tmux windows with Ctrl-ArrowLeft and Ctrl-ArrowRight
# bind -n C-Left previous-window
# bind -n C-Right next-window

# ============================================================================
# KEYBINDINGS — PANES
# ============================================================================

# Single-click pane focus. tmux 3.5+ changed the default MouseDown1Pane to
# also `send-keys -M`, which forwards the click to the pane's app and can
# swallow the first click — making focus feel like it requires two clicks.
# Override to just select the pane on left-click.
#
# Note: this used to work without any explicit binding — the OLD tmux default
# was already `select-pane -t =` (single-click focus). The 3.5+ default added
# `send-keys -M`, so the upstream default changed, not this config. Pinning it
# here restores the old behavior and insulates it from future default churn.
# Tradeoff: without `send-keys -M`, clicks no longer reposition the app's
# cursor (e.g. nvim) — single-click focus and click-to-position can't coexist.
bind-key -T root MouseDown1Pane select-pane -t =

# --- Splits ---
# bind f split-window -v -c "#{pane_current_path}"

# Show git status in separated horizontal split
# bind f split -v "git -c color.status=always status | less -r"
# bind f split "git status"

# Split panes
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -v -c "#{pane_current_path}"

# bind -n c-x split-window -h -c "#{pane_current_path}"
# Horizontal split
# bind -n c-m split-window -h -c "#{pane_current_path}"

# Ctrl+, toggles the AI agent pane selector (same popup as prefix+l).
#
# It arrives here as M-, because fzf cannot bind ctrl-, ("unsupported key"):
# config/ghostty/config rewrites the chord to ESC+comma, which tmux reads as
# M-, to open the popup and fzf reads as alt-, to abort it. That split is what
# makes one key both open and close — inside a popup tmux's key tables are
# bypassed, so only fzf can act on the second press.
#
# The literal c-, binding stays for kitty and any terminal that has not been
# taught the rewrite; there it opens only, and Esc closes.
bind -n M-, display-popup -E -B -w 100% -h 100% "c-tmux-switch-ai-pane"
bind -n c-, display-popup -E -B -w 100% -h 100% "c-tmux-switch-ai-pane"

# Split horizontally with Ctrl-p
# bind -n m split-window -v -c "#{pane_current_path}"

# prefix + o : create a new window in the current pane's cwd, prompting for
# its name. %% is replaced by the typed text. `-e` (tmux 3.7) closes the prompt
# on an empty answer instead of running the command — without it, Enter on an
# empty prompt creates a window named ''.
bind-key o command-prompt -e -p "New window name:" "new-window -c '#{pane_current_path}' -n '%%'"

# Quick horital split
bind-key j split-window -v -c "#{pane_current_path}"

# Quick vertical split
bind-key k split-window -h -c "#{pane_current_path}"

# prefix + p : break the current pane out into its own window, prompting for
# the window name. %% is replaced by the typed text; break-pane makes the new
# window current (no -d). Overrides the old vertical-split on p (still on k).
# `-e` closes the prompt on an empty answer — see prefix+o above.
bind-key p command-prompt -e -p "Move pane to window with name:" "break-pane -n '%%'"

# prefix + i: horizontal split (new pane below) opened in the current pane's cwd.
bind i split-window -v -c "#{pane_current_path}"

# --- Zoom / swap / kill ---

# Expand with ctrl-m. Enter is the same byte as Ctrl-M (CR), and ghostty
# rewrites ctrl+enter to a bare CR too, so this root binding also catches
# plain Enter. Inside a mode (tree-mode, copy-mode) the root table is still
# active, so guard it: forward Enter to the mode there — otherwise Enter
# would zoom the pane instead of choosing the highlighted session/window.
bind -n c-m if-shell -F '#{pane_in_mode}' 'send-keys Enter' 'resize-pane -Z'

# prefix + m: fzf popup to switch to any session. Plain list, no preview, so
# the popup stays small and centered (display-popup centers by default when
# no -x/-y is given).
bind m display-popup -E -w 65% -h 58% "c-tmux-switch-session"

# prefix + n: fzf popup to switch to any pane across all sessions, with a
# live preview of the highlighted pane on the right. Entries are formatted
# "session_name window_name#pane_number".
bind n display-popup -E -w 90% -h 95% "c-tmux-switch-pane"

# prefix + Space: smart action by pane orientation — stacked panes (full-width
# pane) become side-by-side; side-by-side panes swap places (left↔right).
bind Space if-shell -F '#{==:#{pane_width},#{window_width}}' 'select-layout even-horizontal' 'swap-pane -D'

# prefix + u: restore the previous layout. `select-layout` is destructive —
# once prefix+Space (or any preset layout) reflows the window, hand-tuned
# split sizes are gone. `-o` swaps back to the layout in effect before the
# last change, so it doubles as an undo for an accidental reflow.
bind-key u select-layout -o

# Kill current pane with End key
bind -n End kill-pane

# --- Resize ---

# Shift + arrows to resize pane
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# --- Navigation (vim-aware) ---
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Probe: is the foreground process in this pane a running vim/nvim variant?
# Used by the bindings below to pass keys through to the editor when true.
#   ps -o state= -o comm= -t <pane-tty>   lists procs on the pane's tty,
#                                         printing state + command, no header
#   [^TXZ ]+   state isn't Stopped/Dead/Zombie/blank (i.e. actively running)
#   (\S+\/)?   optional leading path (e.g. /usr/local/bin/)
#   g?(view|n?vim?x?)(diff)?   matches vi, vim, view, nvim, gvim, vimdiff, …
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \\
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Ctrl-[ / Ctrl-] scroll the pane buffer without manually entering copy-mode.
# Ctrl-[ enters copy-mode and pages up in one keystroke; Ctrl-] pages down.
#
# `-e` makes scrolling back down to the bottom of the history leave copy-mode
# on its own, so paging down past the last line returns to the live prompt
# without a separate q. This mirrors what the default mouse-wheel binding
# already does (it enters with `copy-mode -et=`), and it only fires on reaching
# the bottom — `y` and `m` still copy without leaving the scroll position.
#
# Press q to exit copy-mode early. Relies on extended-keys (set above) so Ctrl-[
# is distinguishable from Esc. When the pane runs vim/nvim, the keys pass
# through to the editor instead — same $is_vim probe as the C-h/j/k/l bindings.
# Inside copy-mode itself, Ctrl-[ / Ctrl-] page up / down via copy-mode-vi.
bind-key -n 'C-[' if-shell "$is_vim" 'send-keys Escape' 'copy-mode -e ; send-keys -X halfpage-up'
bind-key -n 'C-]' if-shell "$is_vim" 'send-keys C-]' ''
bind-key -T copy-mode-vi 'C-[' send-keys -X halfpage-up
bind-key -T copy-mode-vi 'C-]' send-keys -X halfpage-down

# ============================================================================
# KEYBINDINGS — COPY MODE
# ============================================================================

# Copy-mode → system clipboard via the cross-platform `c-clipboard-copy`
# helper (bin/c-clipboard-copy picks pbcopy / wl-copy / xclip / xsel /
# clip.exe). Replaces the tmux-yank plugin.
#   y                   - copy selection to system clipboard, exit copy-mode
#   m / C-y             - copy, drop the selection, stay put (no scroll jump)
#   MouseDragEnd1Pane   - copy but keep the selection, for mouse selections
#   Y                   - paste tmux buffer (bracketed)
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "c-clipboard-copy"

# Copy and clear the selection while remaining in copy-mode at the current
# scroll position — `y` cancels copy-mode, which snaps the view back to the
# bottom of the history. `C-y` is an alias for the same action.
bind-key -T copy-mode-vi m send-keys -X copy-pipe "c-clipboard-copy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe "c-clipboard-copy"
# bind-key -T copy-mode-vi 'C-y' send-keys -X copy-pipe "c-clipboard-copy"

# Mouse drag: copy without exiting copy-mode so the selection can be refined
# before another action. Use `y` (or `q`) to finalize/leave.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "c-clipboard-copy"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "tmux paste-buffer -p"

# prefix Y → copy current pane's cwd to system clipboard
bind-key Y run-shell "tmux display -p '#{pane_current_path}' | tr -d '\n' | c-clipboard-copy"

# ` → send the copy-mode selection to an AI agent pane (claude / agent) in this
# window as a fenced code block, then focus it. The tmux-side twin of nvim's
# <Leader>` (nvim/lua/functions/tmux.lua); an fzf popup picks the target when
# more than one agent is running. copy-pipe hands the selection to the script
# on stdin, and #{pane_id} is passed explicitly because copy-pipe expands
# formats in the command but does not export TMUX_PANE to the job.
bind-key -T copy-mode-vi '`' send-keys -X copy-pipe-and-cancel "c-tmux-send-selection-to-ai '#{pane_id}'"

# ============================================================================
# KEYBINDINGS — MISC
# ============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  Config reloaded..."

# prefix + n: fzf picker of subdirs of session start dir; selection opens a new
# window named after the subdir, with that subdir as cwd.
# Disabled — prefix+n now holds the pane switcher.
# bind-key n display-popup -E -w 60% -h 60% "c-tmux-new-window-from-subdir"

# Downgrade Shift-Space / Shift-Backspace to their unmodified form before
# they reach the inner pane. With `extended-keys always` (set above), tmux
# otherwise encodes them as CSI 27;2;32~ and CSI 27;2;127~ — zsh has no
# binding for those sequences, so the raw bytes (`[27;2;32~`, `[27;2;127~`)
# leak into the prompt every time Shift slips while typing space or erasing.
# Neither combo needs to be disambiguated anywhere, so collapse them here
# while keeping extended-keys encoding for keys that actually need it
# (<C-i>/<Tab>, <C-m>/<CR>, <C-[>/<Esc>, …).
bind -n S-Space  send-keys Space
bind -n S-BSpace send-keys BSpace

# ============================================================================
# THEME
# ============================================================================

# set -g status-style fg=white,bg=#242533
set -g status-style fg=white,bg=#2f3042
# set-option -g status-style bg=colour18,fg=colour136
# set-option -g status-attr default

## Select mode colors
# Select mode color(use default for now)
set -g mode-style fg=#2f3042,bg=green

# tmux's built-in copy-mode indicator in the pane's top-right corner. It
# defaults to `#{E:mode-style}`, i.e. the same green as the selection
# highlight, which makes the readout compete with the text being selected.
# Give it its own muted chip instead.
setw -g copy-mode-position-style "fg=#e1d39f,bg=#3a3c52,bold"

# Reformat the same indicator. Differences from the tmux default:
#   - drops the `[...]` brackets and `#{t/p:top_line_time}` prefix, adding two
#     spaces of padding on each side so the chip reads as a pill
#   - "N results" becomes  N, and the timeout case gets 󰥔, so the two states
#     are distinguishable at a glance instead of by reading words
# `search_count_partial` is 1 when the search timed out mid-count, rendered as
# a trailing "+" on the number.
setw -g copy-mode-position-format "#[align=right]  #{copy_position}/#{copy_position_limit}#{?search_timed_out, 󰥔 timed out,#{?search_count,  #{search_count}#{?search_count_partial,+,},}}  "

# Line numbers in copy mode (tmux 3.7). `hybrid` prints the cursor's line as an
setw -g copy-mode-line-numbers off

# Per-pane scrollbar (tmux 3.6). Gives scroll position and history depth
# without entering copy mode, which matters with history-limit at 30000.
# Costs one column per pane.
setw -g pane-scrollbars on
setw -g pane-scrollbars-position right
setw -g pane-scrollbars-style "bg=#2f3042,fg=#67676f,width=1,pad=0"

# Window status format
setw -g window-status-format " #I:#W  "
setw -g window-status-current-format " #I:#W  "

# Default window title colors
set-window-option -g window-status-style fg=#f0f0f7,bg=default
# Active window title colors
set-window-option -g window-status-current-style fg=#2f3042,bg=#82d595
# set-window-option -g window-status-current-style fg=#2f3042,bg=#28f780

# Pane border - active pane gets colored rectangle via border-indicators
set -g pane-border-style fg=#67676f
# Green marks the focused pane, which is meaningless when there is only one —
# it just paints the whole bottom border line (drawn by pane-border-status
# below) green. In that case draw the line in the terminal background color
# (config/ghostty/config: background = 252633) so it disappears entirely.
#
# `pane-border-status` is an enum and takes no format, so it cannot be turned
# off conditionally without a hook that retoggles it and reflows the window on
# every split. Blending the glyphs into the background gets the same look for
# free, and the copy-mode HUD below still shows because its segments carry
# their own #[fg=...]#[bg=...].
#
# Style options are format-expanded, so this re-evaluates on redraw.
set -g pane-active-border-style "#{?#{==:#{window_panes},1},fg=#252633,fg=#82d595}"
set -g pane-border-indicators colour
set -g pane-border-lines heavy

# Copy-mode HUD rendered on the pane border. The format resolves to an empty
# string outside copy-mode, so the border looks untouched in normal use; only
# the pane actually in copy-mode draws the bar (#{pane_mode} is per-pane).
#
# Everything below is pure format language — no #(...) subprocess, same rule
# as status-left/right further down.
#
# Escaping: once these variables are interpolated into the #{?cond,yes,no}
# ternary at the bottom, every literal comma inside them sits in the
# "consequent" slot and MUST be written as #, — an unescaped comma silently
# truncates the whole format. (Commas in the "else" slot must NOT be escaped,
# which is why the trailing empty branch stays bare.)
#
# Format operators used:
#   #{==:x,y}     string equality
#   #{&&:a,b}     boolean AND
#   #{e|>|:x,y}   arithmetic comparison
#   #{e|-|:x,y}   subtraction
# %hidden IS_COPY_MODE="#{==:#{pane_mode},copy-mode}"

# search_count is the match count for the active search; search_present guards
# against showing a stale count from the last successful search once the
# cursor has moved off any match. search_count_partial is 1 when the search
# timed out before finishing, rendered as a trailing "+".
# %hidden HAS_SEARCH_RESULT="#{&&:#{e|>|:#{search_count},0},#{search_present}}"
# %hidden RESULT_OR_RESULTS="result#{?#{==:#{search_count},1},,s}"
# %hidden RESULT_COUNT_IS_PARTIAL="#{e|>|:#{search_count_partial},0}"
# %hidden SEARCH_RESULT_COUNT="(#{search_count}#{?$RESULT_COUNT_IS_PARTIAL,+,} $RESULT_OR_RESULTS)"

# # tmux reports scroll_position as distance from the BOTTOM of the history,
# # which counts down as you scroll back. Subtract it from history_size to get
# # a line number counting from the top, matching how every pager reports it.
# %hidden OFFSET_FROM_TOP="#{e|-|:#{history_size},#{scroll_position}}"
# %hidden COPY_MODE_LOCATION="[$OFFSET_FROM_TOP/#{history_size}]"

# %hidden COPY_MODE_LEFT="#[align=left#,fg=#2f3042#,bg=#82d595]  -- COPY --  #[default]"
# %hidden COPY_MODE_RIGHT="#[align=right#,fg=#e1d39f]  #{?$HAS_SEARCH_RESULT,$SEARCH_RESULT_COUNT  ,}$COPY_MODE_LOCATION  #[default]"

# Costs one row per pane permanently — the border line is drawn even for a
# single-pane window. Toggling this per copy-mode entry instead would avoid
# that, but resizes every pane in the window on entry and reflows the very
# scrollback being inspected, so the fixed row is the cheaper trade.
set -g pane-border-status bottom

# The scroll readout now lives in the pane's top-right corner
# (copy-mode-position-format above), so the border carries nothing. Must be
# set explicitly, not left unset: the default format prints `1 "hostname"` on
# every border, and a running server keeps whatever format it was last given —
# an empty string is the only way to clear it on reload.
set -g pane-border-format ""

# Message text. Since tmux 3.7 messages/prompts overlay the status bar instead
# of replacing it; `fill` is required to cover the whole line and hide the
# window list while the rename prompt is active.
set-option -g message-style fg=yellow,bg=#303245,fill=#303245
set-option -g message-command-style fg=yellow,bg=#303245,fill=#303245

# Pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour red #orange

# Keep status-left/right as pure format strings — no #(...) shell hooks.
# Every #() spawns a subprocess on each status-interval tick and blocks
# the redraw until it returns. Use #{?...} format conditionals instead.
# Add zoom indicator to right status panel
set -g status-right '#{?window_zoomed_flag,#[bg=#cba6f7]#[fg=#313244]          TMUX PANE MAXIMIZED (#{pane_index}/#{window_panes})         #[fg=default]#[bg=default],}'

# Clock
# set-window-option -g clock-mode-colour green #green
# set -g status-interval 5

# set -g status-left " #[fg=green]  / #S /  "
set -g status-left " #[fg=#e1d39f]  / #S /  "
set -g status-justify left # center align window list
set -g status-left-length 100
set -g status-right-length 100
