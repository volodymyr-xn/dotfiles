# ============================================================================
# TERMINAL & CAPABILITIES
# ============================================================================

set -g default-terminal "tmux-256color"

# Declare ghostty's capabilities so tmux stops falling back to slower
# escape-heavy encodings.
#   sync         - DECSET 2026 synchronized output; tmux batches a frame and
#                  flips atomically, eliminating tearing on scrollback dumps,
#                  full redraws, and status-bar refreshes
#   RGB          - 24-bit truecolor without xterm-256 quantisation
#   clipboard    - OSC52 clipboard set/get, no shell round-trip
#   focus        - CSI ?1004h focus in/out events (used by nvim, etc.)
#   osc7         - shell-reported cwd
#   title        - window/pane title setting
#   hyperlinks   - OSC 8 clickable links
#   usstyle      - extended underline styles (undercurl, colored, dotted)
#   strikethrough
#   ccolour      - cursor color set via OSC
#   cstyle       - cursor shape set via DECSCUSR
#   extkeys      - distinguish Ctrl-[ from Esc, Ctrl-Enter, etc.
set -ag terminal-features 'xterm-ghostty:sync,RGB,clipboard,focus,osc7,title,hyperlinks,usstyle,strikethrough,ccolour,cstyle,extkeys'

# Use non login shell for tmux windows and panels
set -g default-command "${SHELL}"

# Enable extended keys for Control-number bindings (extkeys already declared
# above for xterm-ghostty; xterm* covers other xterm-family $TERM values).
# `always` (vs `on`) makes tmux unconditionally encode modifier-key combos
# (Ctrl-Shift-letter, Ctrl-[, Ctrl-Enter, etc.) in CSI-u form, so apps that
# don't request DECSET 2027 still receive disambiguated keys — helps nvim
# distinguish <C-i>/<Tab> and <C-m>/<CR>, and hardens the ghostty
# ctrl+number bindings.

# in case of broken mappings try to enable this:
# set -s extended-keys always
set -s extended-keys on

set -as terminal-features 'xterm*:extkeys'

# ============================================================================
# GENERAL OPTIONS
# ============================================================================

# Send SIGHUP to each process on exit
# this presents posgres running after stoping tmux session with it
set-option -g remain-on-exit off

# Sync tmux's copy buffer to the system clipboard via OSC 52
set -s set-clipboard on

# Enable vi mode
set-option -g status-keys "vi"
set-window-option -g mode-keys "vi"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# Disallow to rename windows
set-window-option -g allow-rename off

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# When the last window of a session closes, attach to another session instead
# of detaching the client back to a bare terminal.
set -g detach-on-destroy off

# Remove delay when pressing esc in Vimtmux
set -sg escape-time 0

# Extend display time of status messages to 2 seconds
set-option -g display-time 2000

# Pin status-bar refresh to the tmux default (15s). Several plugins quietly
# override this to 1s or 5s, which causes a full status redraw every second
# and makes the bar feel twitchy. Setting it explicitly keeps it stable.
set-option -g status-interval 15

# Display tmux session name in terminal title (instead of just "tmux")
set-option -g set-titles on
set-option -g set-titles-string '#S:#I #W'

# Increase scrollback lines (default is 2000)
# set-option -g history-limit 5000
set-option -g history-limit 30000

# Forward terminal focus in/out events to programs (nvim autoread, etc.)
set -g focus-events on

# When two clients view the same session at different sizes, size each window
# to its viewer instead of clamping the whole session to the smallest client.
setw -g aggressive-resize on

# Let programs pass escape sequences straight through tmux (Kitty graphics)
set -g allow-passthrough all

# ============================================================================
# PREFIX
# ============================================================================

# Mappings explanation
# Prefix "C-" - means Ctrl button
# Prefix "M-" - means Alt/Meta button

# Remap prefix from 'C-b' to 'C-a', with C-q as a secondary prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================================================
# KEYBINDINGS — SESSIONS
# ============================================================================

# Remap session chooser with disabled preview
bind-key s choose-tree -ZsN -O name
bind-key -T root C-s if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys Down' 'choose-tree -ZsN -O name'
bind-key -T root C-Enter if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys Enter' ''
# bind-key s choose-tree -ZsN -f '#{?@hidden,0,1}'
# bind-key w choose-tree -ZwN -f '#{?@hidden,0,1}'

# Fzf switch tmux session — disabled (prefix+i now splits horizontally)
# bind i split "fzf-switch-tmux-session"
# bind 9 run "tmux split -p 45 bash -ci 'fzf-switch-tmux-session'"

# Switch sessions: Ctrl-Down / Ctrl-- → previous, Ctrl-Up → next
bind -n C-Down switch-client -p
bind -n C-Up switch-client -n
bind -n C-- switch-client -p
