# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"

if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


############# DESIGN CHANGES #######################################
####################################################################
####################################################################

set-option -g status-style bg=colour18,fg=colour136
# set-option -g status-attr default

## Select mode colors

# Select mode color(use default for now)
set -g mode-style fg=black,bg=blue

# Window status format
setw -g window-status-format " #I:#W  "
setw -g window-status-current-format " #I:#W  "

# Default window title colors
set-window-option -g window-status-style fg=colour245,bg=default

# Active window title colors
set-window-option -g window-status-current-style fg=red,bg=default

# Pane border
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=default,bg=default

# Message text
set-option -g message-style fg=yellow,bg=colour18

# Pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour red #orange

# Clock
set-window-option -g clock-mode-colour green #green

set -g status-interval 5
set -g status-justify left # center align window list
set -g status-left-length 50
set -g status-right-length 140

# Remove left status and replace with blank characters
set -g status-left " #[fg=green]  / #S /  "

# Add zoom indicator to right status panel
set -g status-right '#{?window_zoomed_flag,#[bg=yellow]#[fg=black]  ///           TMUX WINDOW ZOOM          ///  #[fg=default]#[bg=default],}'
