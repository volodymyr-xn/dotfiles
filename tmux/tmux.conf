# Use 256 term for pretty colors
# set -g default-terminal "xterm-256color"
# # Use true colors
# set -g terminal-overrides ',xterm-256color:Tc'

# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"

# Use non login shell for tmux windows and panels
set -g default-command "${SHELL}"

set -g terminal-overrides ',xterm-256color:Tc'
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Use Fish shell for tmux sessions
# set-option -g default-shell "/usr/bin/fish"

# Force ZSH shell for tmux sessions
# set-option -g default-shell /usr/local/bin/zsh
# set -g default-command /usr/local/bin/zsh

# Mappings explanation
# Prefix "C-" - means Ctrl button
# Prefix "M-" - means Alt/Meta button

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable vi mode
set-option -g status-keys "vi"
set-window-option -g mode-keys "vi"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# Disallow to rename windows
set-window-option -g allow-rename off

# Renumber windows sequentially after closing any of them
set -g renumber-windows on


# Remap session chooser with disabled preview
bind-key s choose-tree -ZsN
bind-key w choose-tree -ZwN

# Store current path on new window
bind c new-window -c "#{pane_current_path}"
# bind f split-window -v -c "#{pane_current_path}"

# Fzf switch tmux session
bind k split "fzf-switch-tmux-session"

# Show git status in separated horizontal split
bind f split -v "git -c color.status=always status | less -r"
# bind f split "git status"
# bind 9 run "tmux split -p 45 bash -ci 'fzf-switch-tmux-session'"

# Split panes
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -v -c "#{pane_current_path}"

# Quick horizontla split
bind-key o split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "  Config reloaded..."

# Shift + arrows to resize pane
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Swtich beetwen Tmux sessions with Ctrl-ArrowUp and Ctrl-ArrowDown
bind -n C-Up switch-client -n
bind -n C-Down switch-client -p

# TODO
# bind -n M-[ previous-window
# bind -n M-] next-window

bind -n M-[ switch-client -n
bind -n M-] switch-client -p

bind -n M-l next-window
bind -n M-h previous-window

# Swtich beetwen Tmux windows with Ctrl-ArrowLeft and Ctrl-ArrowRight
# bind -n C-Left previous-window
# bind -n C-Right next-window

# Copy selected text into system clipboard with xclip
# bind-key -T copy-mode-vi y send -X copy-selection-and-cancel\; run "tmux save -|xclip -sel clip >/dev/null 2>&1"
#bind-key v vi-copy y copy-pipe 'xclip -in -selection clipboard'
# bind-key -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'

# Enable activity alerts
setw -g monitor-activity off
set -g visual-activity off

# Remove delay when pressing esc in Vim
set -sg escape-time 0

# Extend display time of status messages to 2 seconds
set-option -g display-time 2000

# Display tmux session name in terminal title (instead of just "tmux")
set-option -g set-titles on

# Increase scrollback lines (default is 2000)
set-option -g history-limit 5000


####################################################################
####################################################################
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
####################################################################
####################################################################
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \\
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


####################################################################
############# TMUX THEME ###########################################
####################################################################
####################################################################

set-option -g status-style bg=colour18,fg=colour136
# set-option -g status-attr default

## Select mode colors

# Select mode color(use default for now)
set -g mode-style fg=black,bg=blue

# Window status format
setw -g window-status-format " #I:#W  "
setw -g window-status-current-format " #I:#W  "

# Default window title colors
set-window-option -g window-status-style fg=colour245,bg=default

# Active window title colors
# set-window-option -g window-status-current-style fg=red,bg=default
set-window-option -g window-status-current-style fg=black,bg=yellow

# Pane border
set -g pane-border-style fg=yellow,bg=default
set -g pane-active-border-style fg=yellow,bg=default

# Message text
set-option -g message-style fg=yellow,bg=colour18

# Pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour red #orange

# Clock
set-window-option -g clock-mode-colour green #green

set -g status-interval 5
set -g status-justify left # center align window list
set -g status-left-length 50
set -g status-right-length 140

# Remove left status and replace with blank characters
set -g status-left " #[fg=green]  / #S /  "

# Add zoom indicator to right status panel
set -g status-right '#{?window_zoomed_flag,#[bg=yellow]#[fg=black]  ///     TMUX WINDOW MAXIMIZED       ///  #[fg=default]#[bg=default],}'


##### Plugins ###############

set -g @plugin 'tmux-plugins/tpm'
# Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
